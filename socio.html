<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPSC GS-I | Modern History of India — Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;700&family=Cormorant+Garamond:ital,wght@0,700;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg:         #100f0a;
  --surface:    #181611;
  --card:       #1e1c13;
  --card-hover: #252216;
  --border:     #32301e;
  --line:       #3a3621;
  --text:       #ddd3b4;
  --text-dim:   #8a8068;
  --text-muted: #5a5240;
  --bright:     #f0e6cc;
  --gold:       #c4963a;
  --gold-dim:   #7a5e22;

  --cat-economic:      #c0392b;
  --cat-constitutional:#2980b9;
  --cat-military:      #d35400;
  --cat-nationalist:   #27ae60;
  --cat-reform:        #8e44ad;
  --cat-doctrine:      #e6a817;
  --cat-press:         #16a085;

  --era1-bg: #120d12;
  --era2-bg: #0d1218;
  --era3-bg: #0d1210;
  --era4-bg: #141008;
  --era5-bg: #0d0e18;
  --era6-bg: #110d08;
  --era7-bg: #080e10;

  --radius: 4px;
  --shadow: 0 2px 12px rgba(0,0,0,0.5);
}

*{margin:0;padding:0;box-sizing:border-box;}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 17px;
  line-height: 1.65;
  min-height: 100vh;
}

/* ── HEADER ─────────────────────────────────── */
#header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(16,15,10,0.97);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(8px);
  padding: 14px 24px 10px;
}

#header-top {
  display: flex;
  align-items: baseline;
  gap: 16px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}

h1 {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 0.02em;
  white-space: nowrap;
}

#subtitle {
  font-size: 13px;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.05em;
}

#count-display {
  margin-left: auto;
  font-size: 12px;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  white-space: nowrap;
  align-self: center;
}

#search-row {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 10px;
}

#search {
  flex: 1;
  max-width: 360px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'Crimson Pro', serif;
  font-size: 15px;
  padding: 7px 12px;
  border-radius: var(--radius);
  outline: none;
  transition: border-color .2s;
}
#search:focus { border-color: var(--gold-dim); }
#search::placeholder { color: var(--text-muted); }

#clear-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 12px;
  padding: 6px 10px;
  border-radius: var(--radius);
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  transition: all .15s;
  display: none;
}
#clear-btn:hover { color: var(--text); border-color: var(--gold-dim); }

/* ── CATEGORY FILTERS ───────────────────────── */
#filters {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.filter-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 3px;
  border: 1px solid transparent;
  font-size: 12.5px;
  font-family: 'JetBrains Mono', monospace;
  cursor: pointer;
  transition: all .15s;
  user-select: none;
  opacity: 0.45;
}
.filter-chip.active { opacity: 1; }
.filter-chip .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.filter-chip:hover { opacity: 0.85; }

.chip-economic    { border-color: var(--cat-economic); color: var(--cat-economic); }
.chip-constitutional { border-color: var(--cat-constitutional); color: var(--cat-constitutional); }
.chip-military    { border-color: var(--cat-military); color: var(--cat-military); }
.chip-nationalist { border-color: var(--cat-nationalist); color: var(--cat-nationalist); }
.chip-reform      { border-color: var(--cat-reform); color: var(--cat-reform); }
.chip-doctrine    { border-color: var(--cat-doctrine); color: var(--cat-doctrine); }
.chip-press       { border-color: var(--cat-press); color: var(--cat-press); }

/* ── ERA NAVIGATION ─────────────────────────── */
#era-nav {
  display: flex;
  gap: 4px;
  padding: 8px 24px;
  overflow-x: auto;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  scrollbar-width: none;
}
#era-nav::-webkit-scrollbar { display: none; }

.era-pill {
  white-space: nowrap;
  padding: 4px 12px;
  border-radius: 2px;
  font-size: 11.5px;
  font-family: 'JetBrains Mono', monospace;
  cursor: pointer;
  border: 1px solid var(--border);
  color: var(--text-dim);
  transition: all .15s;
  background: none;
}
.era-pill:hover { color: var(--bright); border-color: var(--gold-dim); }

/* ── TIMELINE CONTAINER ─────────────────────── */
#timeline {
  max-width: 960px;
  margin: 0 auto;
  padding: 0 24px 80px;
}

/* ── ERA SECTION ────────────────────────────── */
.era-section {
  margin-top: 0;
}

.era-header {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 28px 0 18px;
  position: relative;
}

.era-header::before {
  content: '';
  position: absolute;
  left: -24px; right: -24px;
  top: 0; bottom: 0;
  pointer-events: none;
  z-index: 0;
}

.era-section:nth-child(1) .era-header::before { background: var(--era1-bg); }
.era-section:nth-child(2) .era-header::before { background: var(--era2-bg); }
.era-section:nth-child(3) .era-header::before { background: var(--era3-bg); }
.era-section:nth-child(4) .era-header::before { background: var(--era4-bg); }
.era-section:nth-child(5) .era-header::before { background: var(--era5-bg); }
.era-section:nth-child(6) .era-header::before { background: var(--era6-bg); }
.era-section:nth-child(7) .era-header::before { background: var(--era7-bg); }

.era-badge {
  background: var(--gold-dim);
  color: var(--bg);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 2px;
  white-space: nowrap;
  position: relative;
  z-index: 1;
}

.era-title {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 21px;
  font-weight: 700;
  color: var(--bright);
  letter-spacing: 0.03em;
  position: relative;
  z-index: 1;
}

.era-desc {
  font-size: 13px;
  color: var(--text-muted);
  font-style: italic;
  position: relative;
  z-index: 1;
}

.era-count {
  margin-left: auto;
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-muted);
  position: relative;
  z-index: 1;
}

/* ── EVENTS WRAPPER ─────────────────────────── */
.events-wrapper {
  position: relative;
  padding-left: 80px;
}

.events-wrapper::before {
  content: '';
  position: absolute;
  left: 36px;
  top: 0; bottom: 0;
  width: 1px;
  background: linear-gradient(to bottom, transparent, var(--line) 40px, var(--line) calc(100% - 40px), transparent);
}

/* ── EVENT CARD ─────────────────────────────── */
.event-row {
  display: flex;
  align-items: flex-start;
  gap: 0;
  margin-bottom: 6px;
  position: relative;
}

.event-row.hidden { display: none; }

.year-col {
  position: absolute;
  left: -80px;
  width: 72px;
  text-align: right;
  padding-top: 10px;
}

.year-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 700;
  color: var(--gold);
  display: block;
}

.month-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-muted);
  display: block;
}

.dot-col {
  position: absolute;
  left: -48px;
  padding-top: 13px;
}

.timeline-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 2px solid var(--bg);
  flex-shrink: 0;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 3px solid transparent;
  border-radius: var(--radius);
  padding: 10px 14px;
  cursor: pointer;
  flex: 1;
  transition: background .15s, box-shadow .15s;
  position: relative;
}

.card:hover {
  background: var(--card-hover);
  box-shadow: var(--shadow);
}

.card.expanded {
  background: var(--card-hover);
  box-shadow: var(--shadow);
}

.card-header {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}

.card-title {
  font-family: 'Libre Baskerville', Georgia, serif;
  font-size: 14.5px;
  font-weight: 700;
  color: var(--bright);
  flex: 1;
  min-width: 200px;
}

.cat-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 2px;
  white-space: nowrap;
  opacity: 0.8;
  border: 1px solid currentColor;
}

.card-short {
  font-size: 14px;
  color: var(--text-dim);
  margin-top: 3px;
  line-height: 1.5;
}

/* Expanded content */
.card-body {
  display: none;
  margin-top: 12px;
  border-top: 1px solid var(--border);
  padding-top: 12px;
}

.card.expanded .card-body {
  display: block;
  animation: fadeIn .2s ease;
}

@keyframes fadeIn { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:none} }

.card-detail {
  font-size: 14.5px;
  color: var(--text);
  margin-bottom: 10px;
  line-height: 1.7;
}

.card-quote {
  background: rgba(196,150,58,0.07);
  border-left: 2px solid var(--gold-dim);
  padding: 8px 12px;
  margin: 10px 0;
  font-style: italic;
  font-size: 14px;
  color: var(--text-dim);
  border-radius: 0 var(--radius) var(--radius) 0;
}

.card-quote cite {
  display: block;
  font-size: 12px;
  font-style: normal;
  color: var(--text-muted);
  margin-top: 4px;
  font-family: 'JetBrains Mono', monospace;
}

.upsc-box {
  background: rgba(196,150,58,0.05);
  border: 1px solid var(--gold-dim);
  border-radius: var(--radius);
  padding: 8px 12px;
  margin-top: 10px;
}

.upsc-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 0.1em;
  margin-bottom: 4px;
  display: block;
}

.upsc-text {
  font-size: 13.5px;
  color: var(--text-dim);
  line-height: 1.6;
}

.pyq-tag {
  display: inline-block;
  background: rgba(192,57,43,0.15);
  border: 1px solid rgba(192,57,43,0.4);
  color: #e07060;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 2px;
  margin-left: 6px;
  vertical-align: middle;
}

/* Category-specific border colors */
.card[data-category="economic"]       { border-left-color: var(--cat-economic); }
.card[data-category="constitutional"] { border-left-color: var(--cat-constitutional); }
.card[data-category="military"]       { border-left-color: var(--cat-military); }
.card[data-category="nationalist"]    { border-left-color: var(--cat-nationalist); }
.card[data-category="reform"]         { border-left-color: var(--cat-reform); }
.card[data-category="doctrine"]       { border-left-color: var(--cat-doctrine); }
.card[data-category="press"]          { border-left-color: var(--cat-press); }

.dot-economic       { background: var(--cat-economic); }
.dot-constitutional { background: var(--cat-constitutional); }
.dot-military       { background: var(--cat-military); }
.dot-nationalist    { background: var(--cat-nationalist); }
.dot-reform         { background: var(--cat-reform); }
.dot-doctrine       { background: var(--cat-doctrine); }
.dot-press          { background: var(--cat-press); }

.tag-economic       { color: var(--cat-economic); border-color: var(--cat-economic); }
.tag-constitutional { color: var(--cat-constitutional); border-color: var(--cat-constitutional); }
.tag-military       { color: var(--cat-military); border-color: var(--cat-military); }
.tag-nationalist    { color: var(--cat-nationalist); border-color: var(--cat-nationalist); }
.tag-reform         { color: var(--cat-reform); border-color: var(--cat-reform); }
.tag-doctrine       { color: var(--cat-doctrine); border-color: var(--cat-doctrine); }
.tag-press          { color: var(--cat-press); border-color: var(--cat-press); }

/* ── EMPTY STATE ────────────────────────────── */
#empty-state {
  display: none;
  text-align: center;
  padding: 60px 0;
  color: var(--text-muted);
  font-style: italic;
  font-size: 16px;
}

/* ── SEARCH HIGHLIGHT ───────────────────────── */
mark {
  background: rgba(196,150,58,0.3);
  color: inherit;
  border-radius: 2px;
}

/* ── SCROLLBAR ──────────────────────────────── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── LEGEND ROW ─────────────────────────────── */
#legend {
  padding: 6px 24px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  flex-wrap: wrap;
}
#legend span { color: var(--text-dim); }

@media (max-width: 640px) {
  #header { padding: 12px 16px 8px; }
  h1 { font-size: 17px; }
  #timeline { padding: 0 16px 60px; }
  .events-wrapper { padding-left: 60px; }
  .events-wrapper::before { left: 24px; }
  .year-col { left: -62px; width: 54px; }
  .year-badge { font-size: 11px; }
  .dot-col { left: -34px; }
  .era-title { font-size: 17px; }
}
</style>
</head>
<body>

<div id="header">
  <div id="header-top">
    <h1>Modern History of India</h1>
    <span id="subtitle">UPSC GS-I | 1600–1948</span>
    <span id="count-display"></span>
  </div>
  <div id="search-row">
    <input type="text" id="search" placeholder="Search events, personalities, acts, battles…" autocomplete="off">
    <button id="clear-btn" onclick="clearSearch()">✕ clear</button>
  </div>
  <div id="filters">
    <div class="filter-chip chip-economic active" onclick="toggleFilter('economic')" title="Economic">
      <span class="dot" style="background:var(--cat-economic)"></span>Economic
    </div>
    <div class="filter-chip chip-constitutional active" onclick="toggleFilter('constitutional')" title="Constitutional">
      <span class="dot" style="background:var(--cat-constitutional)"></span>Constitutional
    </div>
    <div class="filter-chip chip-military active" onclick="toggleFilter('military')" title="Military / Wars">
      <span class="dot" style="background:var(--cat-military)"></span>Military
    </div>
    <div class="filter-chip chip-nationalist active" onclick="toggleFilter('nationalist')" title="Nationalist Movement">
      <span class="dot" style="background:var(--cat-nationalist)"></span>Nationalist
    </div>
    <div class="filter-chip chip-reform active" onclick="toggleFilter('reform')" title="Social / Religious Reform">
      <span class="dot" style="background:var(--cat-reform)"></span>Reform
    </div>
    <div class="filter-chip chip-doctrine active" onclick="toggleFilter('doctrine')" title="Doctrines & Policies">
      <span class="dot" style="background:var(--cat-doctrine)"></span>Doctrine
    </div>
    <div class="filter-chip chip-press active" onclick="toggleFilter('press')" title="Press & Education">
      <span class="dot" style="background:var(--cat-press)"></span>Press/Education
    </div>
  </div>
</div>

<div id="era-nav">
  <button class="era-pill" onclick="jumpToEra('era1')">▸ Company Origins (1600–1757)</button>
  <button class="era-pill" onclick="jumpToEra('era2')">▸ Conquest (1757–1813)</button>
  <button class="era-pill" onclick="jumpToEra('era3')">▸ Consolidation (1813–1857)</button>
  <button class="era-pill" onclick="jumpToEra('era4')">▸ Crown Rule (1857–1885)</button>
  <button class="era-pill" onclick="jumpToEra('era5')">▸ Early Nationalism (1885–1919)</button>
  <button class="era-pill" onclick="jumpToEra('era6')">▸ Gandhian Era (1919–1942)</button>
  <button class="era-pill" onclick="jumpToEra('era7')">▸ Independence (1942–1948)</button>
</div>

<div id="legend">
  <span>Click any event to expand details + UPSC angle</span>
  &nbsp;·&nbsp;
  <span style="color:#e07060">PYQ</span> = Past Year Question topic
</div>

<div id="timeline"></div>
<div id="empty-state">No events match your search or filter.</div>

<script>
// ── EVENT DATA ────────────────────────────────────────────────────────────────
const events = [

// ═══ ERA 1: Company Origins 1600–1757 ════════════════════════════════════════
{ era:"era1", year:1600, title:"East India Company (EIC) Founded",
  cat:"constitutional",
  short:"Queen Elizabeth I grants monopoly charter on trade east of the Cape of Good Hope.",
  detail:"The EIC started as a purely commercial body — a joint-stock company of London merchants. It had no intention of governing territory. Its transformation into a ruling power over 200 years is one of history's most extraordinary corporate overreaches.",
  quote:"", quoteBy:"",
  upsc:"Context for all subsequent events. Distinction between Company as trader vs. Company as ruler is a recurring UPSC theme. The 1833 Charter Act marks the formal transition from trade to governance.",

  detail:"The three Carnatic Wars (1744–48, 1749–54, 1756–63) were fought partly in India and partly as offshoots of European conflicts. The key figure: French Governor Dupleix (1742–54) pioneered the technique of interfering in Indian succession disputes, stationing French-officered troops at Indian courts — the model that Wellesley later copied as the Subsidiary Alliance.",
  quote:"Dupleix first showed that the conquest of India was possible. The British concluded that since it was possible, it was also desirable.", quoteBy:"Robert Orme, British historian",

{ era:"era1", year:1751, title:"Clive at Arcot — British Ascendancy Confirmed",
  cat:"military",
  short:"Robert Clive's defence of Arcot (1751) breaks French-backed power in the Deccan.",
  detail:"With just 200 men, the 25-year-old Robert Clive held Arcot Fort against a French-backed force for 53 days. This single action shifted the balance of the Carnatic Wars permanently toward Britain. Clive's subsequent rise defines the early Company conquest era.",

  upsc:"Important for understanding WHY Britain won the Carnatic Wars — leadership + logistics + local alliances, not just superior arms. Leads directly to Plassey (1757).",
  pyq:false, keywords:["clive","arcot","arcot","carnatic","french","1751","deccan"] },

// ═══ ERA 2: Conquest & Ring Fence 1757–1813 ══════════════════════════════════
{ era:"era2", year:1757, title:"Battle of Plassey",
  cat:"military",
  short:"Clive defeats Nawab Siraj-ud-Daula; Company gains mastery over Bengal — the richest province in India.",
  detail:"June 23, 1757. The battle was half-fought — Mir Jafar's betrayal (he commanded most of the Nawab's army and kept his troops out of battle) was arranged beforehand by Clive. The battle itself lasted barely hours. But it was the turning point: the Company went from a trading body to a territorial power virtually overnight. Mir Jafar was installed as the new Nawab and paid the Company enormous compensation.",

  pyq:true, keywords:["plassey","clive","siraj","mir jafar","bengal","1757","diwani","nawab","buxar"] },

{ era:"era2", year:1764, title:"Battle of Buxar",
  cat:"military",
  short:"Company defeats combined forces of the Nawab of Awadh, Mir Qasim of Bengal, and the Mughal Emperor — full political supremacy confirmed.",
  detail:"Buxar (October 22, 1764) is militarily more significant than Plassey because the Company fought actual armies, not a betrayed one. The Treaty of Allahabad (1765) followed: the Mughal Emperor granted the Company the Diwani (revenue rights) of Bengal, Bihar, and Orissa. This transformed the Company from military victor to legitimate revenue-collector.",

{ era:"era3", year:1833, title:"Charter Act 1833 — Governor-General of India Created",

{ era:"era4", year:1876, title:"Great Famine 1876–78 — Lytton's Durbar",

// ── CATEGORIES & ERAS CONFIG ─────────────────────────────────────────────────
const catLabels = {
  economic:       "Economic",
  constitutional: "Constitutional",
  military:       "Military",
  nationalist:    "Nationalist",
  reform:         "Reform",
  doctrine:       "Doctrine",
  press:          "Press/Edu"
};

const eras = [
  { id:"era1", title:"Company Origins",        range:"1600–1757", desc:"Before Plassey; Anglo-French rivalry; Ring Fence policy" },
  { id:"era2", title:"Conquest & Ring Fence",  range:"1757–1813", desc:"Plassey to Charter Act; Diwani, Ring Fence, Subsidiary Alliance" },
  { id:"era3", title:"Company Consolidation", range:"1813–1857", desc:"Charter Acts era; Permanent Settlement; education debates; Doctrine of Lapse" },
  { id:"era4", title:"Great Revolt & Crown Rule",range:"1857–1885",desc:"1857 to INC founding; GOI Act 1858; Drain theory; Vernacular Press Act" },
  { id:"era5", title:"Early Nationalism",      range:"1885–1919", desc:"INC to Jallianwala Bagh; Partition of Bengal; Extremists; Morley-Minto" },
  { id:"era6", title:"Gandhian Mass Movements",range:"1919–1942", desc:"NCM to QIM; CDM; Poona Pact; GOI 1935; Lahore Resolution" },
  { id:"era7", title:"Independence & Partition",range:"1942–1948",desc:"QIM to Operation Polo; INA; RIN Mutiny; Cabinet Mission; Partition" }
];

// ── STATE ────────────────────────────────────────────────────────────────────
let activeFilters = new Set(["economic","constitutional","military","nationalist","reform","doctrine","press"]);
let searchQuery = "";
let expandedCard = null;

// ── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  const container = document.getElementById("timeline");
  container.innerHTML = "";
  let visibleCount = 0;

  eras.forEach(era => {
    const eraEvents = events.filter(e => e.era === era.id);
    const visibleEraEvents = eraEvents.filter(e => isVisible(e));

    const section = document.createElement("div");
    section.className = "era-section";
    section.id = era.id;

    section.innerHTML = `
      <div class="era-header">
        <span class="era-badge">${era.range}</span>
        <span class="era-title">${era.title}</span>
        <span class="era-desc">${era.desc}</span>
        <span class="era-count">${visibleEraEvents.length} event${visibleEraEvents.length!==1?'s':''}</span>
      </div>
      <div class="events-wrapper" id="wrap-${era.id}"></div>`;

    container.appendChild(section);

    const wrapper = section.querySelector(`#wrap-${era.id}`);
    let eraVisible = 0;

    eraEvents.forEach(ev => {
      const visible = isVisible(ev);
      if (visible) { visibleCount++; eraVisible++; }
      const row = createEventRow(ev, visible);
      wrapper.appendChild(row);
    });

    if (eraVisible === 0) section.style.display = "none";
    else section.style.display = "";
  });

  document.getElementById("count-display").textContent = `${visibleCount} of ${events.length} events`;
  document.getElementById("empty-state").style.display = visibleCount === 0 ? "block" : "none";
}

function isVisible(ev) {
  if (!activeFilters.has(ev.cat)) return false;
  if (!searchQuery) return true;
  const q = searchQuery.toLowerCase();
  return ev.title.toLowerCase().includes(q)
    || ev.short.toLowerCase().includes(q)
    || ev.detail.toLowerCase().includes(q)
    || ev.keywords.some(k => k.includes(q))
    || String(ev.year).includes(q);
}

function createEventRow(ev, visible) {
  const row = document.createElement("div");
  row.className = "event-row" + (visible ? "" : " hidden");
  row.dataset.id = ev.year + ev.title.slice(0,10);

  const hasQuote = ev.quote && ev.quote.length > 0;
  const titleHtml = highlight(ev.title);
  const shortHtml = highlight(ev.short);

  row.innerHTML = `
    <div class="year-col">
      <span class="year-badge">${ev.year}</span>
    </div>
    <div class="dot-col">
      <div class="timeline-dot dot-${ev.cat}"></div>
    </div>
    <div class="card" data-category="${ev.cat}" onclick="toggleCard(this)">
      <div class="card-header">
        <span class="card-title">${titleHtml}${ev.pyq ? '<span class="pyq-tag">PYQ</span>' : ''}</span>
        <span class="cat-tag tag-${ev.cat}">${catLabels[ev.cat]}</span>
      </div>
      <div class="card-short">${shortHtml}</div>
      <div class="card-body">
        <div class="card-detail">${highlight(ev.detail)}</div>
        ${hasQuote ? `<div class="card-quote">"${ev.quote}"<cite>— ${ev.quoteBy}</cite></div>` : ''}
        <div class="upsc-box">
          <span class="upsc-label">▲ UPSC ANGLE</span>
          <div class="upsc-text">${ev.upsc}</div>
        </div>
      </div>
    </div>`;
  return row;
}

function highlight(text) {
  if (!searchQuery || searchQuery.length < 2) return text;
  const escaped = searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
}

// ── INTERACTIONS ─────────────────────────────────────────────────────────────
function toggleCard(card) {
  if (expandedCard && expandedCard !== card) {
    expandedCard.classList.remove("expanded");
  }
  card.classList.toggle("expanded");
  expandedCard = card.classList.contains("expanded") ? card : null;
}

function toggleFilter(cat) {
  if (activeFilters.has(cat)) {
    if (activeFilters.size === 1) return; // keep at least one
    activeFilters.delete(cat);
    document.querySelector(`.chip-${cat}`).classList.remove("active");
  } else {
    activeFilters.add(cat);
    document.querySelector(`.chip-${cat}`).classList.add("active");
  }
  render();
}

function clearSearch() {
  document.getElementById("search").value = "";
  searchQuery = "";
  document.getElementById("clear-btn").style.display = "none";
  render();
}

function jumpToEra(eraId) {
  const el = document.getElementById(eraId);
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
}

// ── SEARCH ───────────────────────────────────────────────────────────────────
document.getElementById("search").addEventListener("input", function() {
  searchQuery = this.value.trim();
  document.getElementById("clear-btn").style.display = searchQuery ? "inline-block" : "none";
  if (expandedCard) { expandedCard.classList.remove("expanded"); expandedCard = null; }
  render();
});

// ── INIT ─────────────────────────────────────────────────────────────────────
render();
</script>
